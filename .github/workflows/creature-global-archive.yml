name: Global Creature Archive Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "vtt/creature_archive.gd"
      - "vtt/creature_local_storage.gd"
      - "vtt/master_creature_store.gd"
      - "vtt/player_character_store.gd"
      - "tests/test_global_creature_archive.gd"
      - ".github/workflows/creature-global-archive.yml"
  workflow_dispatch:
concurrency:
  group: global-creature-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  archive-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /encounter/*.gd
            /interaction/
            /items/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse project
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Test archive and migrated sheets
        run: |
          set -euo pipefail
          for test in test_global_creature_archive.gd test_creature_archive_revisions.gd test_creature_sheets.gd test_creature_reference_completion.gd; do
            echo "== $test =="
            log="$(mktemp)"
            if ! timeout 110s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/$test" > "$log" 2>&1; then
              cat "$log"; exit 1
            fi
            cat "$log"
            grep -q 'PASS:' "$log"
            if grep -q 'SCRIPT ERROR:' "$log"; then exit 1; fi
            rm "$log"
          done
