name: Global Creature Archive Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "vtt/creature_archive.gd"
      - "vtt/creature_local_storage.gd"
      - "vtt/master_creature_store.gd"
      - "vtt/player_character_store.gd"
      - "vtt/mobile/creatures_mobile.gd"
      - "tests/test_global_creature_archive.gd"
      - "tests/test_creature_archive_revisions.gd"
      - "tests/test_creature_sheets.gd"
      - "tests/test_creature_reference_completion.gd"
      - ".github/workflows/creature-global-archive.yml"

jobs:
  archive-regressions:
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /interaction/
            /items/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/
      - name: Import and parse
        shell: powershell
        run: |
          $exe = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $exe --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run targeted creature archive tests
        shell: powershell
        run: |
          $exe = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          foreach ($test in @(
            "test_global_creature_archive.gd",
            "test_creature_archive_revisions.gd",
            "test_creature_sheets.gd",
            "test_creature_reference_completion.gd"
          )) {
            $stdout = [IO.Path]::GetTempFileName()
            $stderr = $stdout + ".err"
            try {
              $proc = Start-Process -FilePath $exe -ArgumentList @(
                "--headless", "--path", ".", "--script", "res://tests/$test"
              ) -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $log = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) +
                (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
              Write-Host "== $test ==`n$log"
              if ($proc.ExitCode -ne 0 -or $log -notmatch "PASS:" -or $log -match "SCRIPT ERROR:") {
                throw "Archive regression failed: $test"
              }
            } finally {
              Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
            }
          }
