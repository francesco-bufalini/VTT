name: Linked Token Motion (Godot)

on:
  pull_request:
    paths:
      - "vtt/mount_controller.gd"
      - "tests/test_linked_token_motion.gd"
      - "dnd_base.gd"
      - "interaction/token_drag.gd"
      - ".github/workflows/linked-token-motion.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/mount_controller.gd
            /tests/test_linked_token_motion.gd
            /.github/workflows/linked-token-motion.yml

      - name: Download matching Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Run isolated transform regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/linked-token-test/vtt /tmp/linked-token-test/tests
          printf 'config_version=5\n' > /tmp/linked-token-test/project.godot
          cp vtt/mount_controller.gd /tmp/linked-token-test/vtt/
          cp tests/test_linked_token_motion.gd /tmp/linked-token-test/tests/
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path /tmp/linked-token-test \
            --script res://tests/test_linked_token_motion.gd
