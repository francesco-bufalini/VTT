name: Character racial speed regression (Godot)
on:
  pull_request:
    paths:
      - "vtt/player_character_store.gd"
      - "vtt/creature_race_rules.gd"
      - "vtt/creature_bonus_rules.gd"
      - "tests/test_race_subrace_selection.gd"
      - "tests/test_creature_sheets.gd"
      - ".github/workflows/race-speed-regression.yml"
  workflow_dispatch:
jobs:
  racial-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /interaction/
            /encounter/*.gd
            /items/
            /homebrew/
            /tests/test_race_subrace_selection.gd
            /tests/test_creature_sheets.gd
            /assets/items/
            /assets/tokens/test/
            /assets/spell_area_geometry.json
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import scripts and run race-speed regressions
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import --quit
          for test in test_race_subrace_selection.gd test_creature_sheets.gd; do
            echo "::group::$test"
            log=$(mktemp)
            if ! timeout 60s "$GODOT" --headless --path . --script "res://tests/$test" >"$log" 2>&1; then
              cat "$log"; exit 1
            fi
            cat "$log"
            if grep -Eq '^SCRIPT ERROR:|^ERROR:' "$log" || ! grep -Eq '^PASS' "$log"; then
              exit 1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
