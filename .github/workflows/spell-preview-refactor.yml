name: Spell Preview Refactor Regression

on:
  push:
    branches: [main]
    paths:
      - "vtt/spells/spell_system.gd"
      - "tests/test_spell_preview_resolver.gd"
      - ".github/workflows/spell-preview-refactor.yml"
  workflow_dispatch:

concurrency:
  group: spell-preview-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spell-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /encounter/*.gd
            /interaction/
            /items/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Preview geometry and target lifecycle
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          for test in \
            test_spell_preview_resolver.gd \
            test_spell_targeting_lifecycle.gd \
            test_spell_targeting_2d.gd \
            test_aoe_sync.gd
          do
            echo "== $test =="
            log="$(mktemp)"
            if ! timeout 100s "$GODOT" --headless --path . --script "res://tests/$test" > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            grep -q "PASS:" "$log"
            if grep -q "SCRIPT ERROR:" "$log"; then exit 1; fi
            rm "$log"
          done
