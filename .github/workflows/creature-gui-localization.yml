name: Creature GUI localization (Godot)

on:
  pull_request:
    paths:
      - "vtt/creature_gui_locale.gd"
      - "vtt/creature_area.gd"
      - "tests/test_creature_gui_locale.gd"
      - ".github/workflows/creature-gui-localization.yml"
  push:
    branches: [main]
    paths:
      - "vtt/creature_gui_locale.gd"
      - "vtt/creature_area.gd"
      - "tests/test_creature_gui_locale.gd"
  workflow_dispatch:

jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /vtt/creature_gui_locale.gd
            /tests/test_creature_gui_locale.gd
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Test Italian / English creature UI
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://tests/test_creature_gui_locale.gd 2>&1 | tee /tmp/locale-test.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Assertion failed' /tmp/locale-test.log; then exit 1; fi
          grep -Fq 'PASS: creature GUI localization' /tmp/locale-test.log
