name: Standalone Creatures (Godot)

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/standalone-creatures-from-pr85
    paths:
      - "vtt/creature_area.gd"
      - "vtt/compendium.gd"
      - "vtt/dice_roller_chat.gd"
      - "vtt/creature_public_status.gd"
      - "vtt/standalone/**"
      - "tests/test_standalone_creatures.gd"
      - ".github/workflows/standalone-creatures.yml"

jobs:
  standalone:
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 8
    steps:
      - name: Checkout creature test surface
        uses: actions/checkout@v4
        with:
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /homebrew/
            /tests/test_standalone_creatures.gd
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/test_token_visual.tscn

      - name: Clean generated files
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/

      - name: Import Godot script dependencies
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $godot --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run standalone creature test
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $godot --headless --path . --script res://tests/test_standalone_creatures.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
