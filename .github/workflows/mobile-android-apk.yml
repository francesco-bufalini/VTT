name: VTT Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/slim-mobile-android-20261014
    paths:
      - ".github/workflows/mobile-android-apk.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "build.ps1"
      - "tools/prepare_mobile_export.ps1"
      - "vtt/**"
      - "network/**"
      - "tests/test_mobile_*.gd"

permissions:
  contents: read

concurrency:
  group: vtt-mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validate and build slim Android APK
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Ensure complete checkout
        shell: powershell
        run: |
          git sparse-checkout disable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import resources and validate mobile scripts
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $godot --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @("test_mobile_touch_layout.gd", "test_mobile_sheet_navigation.gd", "test_mobile_main_menu.gd")) {
            Write-Host "Running $test"
            & $godot --headless --path . --script "res://tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }

      - name: Prepare and validate isolated mobile export
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          $stage = Join-Path $env:RUNNER_TEMP "VTT-mobile-$env:GITHUB_RUN_ID"
          .\tools\prepare_mobile_export.ps1 -Source (Get-Location).Path -Destination $stage
          & $godot --headless --path $stage --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw "Mobile resource import failed." }
          foreach ($test in @("test_mobile_touch_layout.gd", "test_mobile_sheet_navigation.gd", "test_mobile_main_menu.gd")) {
            Write-Host "Checking staged mobile resources: $test"
            & $godot --headless --path $stage --script "res://tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Staged mobile regression failed: $test" }
          }
          Write-Host "Staged project validated; desktop source checkout was not modified."

      - name: Export installable Android APK
        id: export
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          $stage = Join-Path $env:RUNNER_TEMP "VTT-mobile-$env:GITHUB_RUN_ID"
          if (-not (Test-Path (Join-Path $stage "project.godot"))) { throw "Staged mobile project missing" }
          New-Item -ItemType Directory -Force "build/android" | Out-Null
          $localKey = Join-Path $env:APPDATA "VTT/signing/release.keystore"
          $localPassword = Join-Path $env:APPDATA "VTT/signing/release-password.txt"
          $explicitKey = $env:GODOT_ANDROID_KEYSTORE_RELEASE_PATH
          $releaseAvailable = (($explicitKey -and (Test-Path $explicitKey) -and $env:GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD) -or ((Test-Path $localKey) -and (Test-Path $localPassword)))
          if ($releaseAvailable) {
            Write-Host "Release signing is available: exporting update-compatible APK."
            & (Join-Path $stage "build.ps1") -Godot $godot -Target android -OutputRoot (Join-Path (Get-Location).Path "build")
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $apk = "build/android/VTT-Android.apk"
            $signing = "release"
          } else {
            # Never invent a new release signing identity: a different release
            # certificate would silently break updates to existing installs.
            Write-Warning "Release key unavailable on this runner. Building a debug-signed APK for fresh installations."
            $debugKey = Join-Path $env:USERPROFILE ".android/debug.keystore"
            if (-not (Test-Path $debugKey)) {
              New-Item -ItemType Directory -Force (Split-Path $debugKey) | Out-Null
              $keytools = @()
              if ($env:JAVA_HOME) { $keytools += (Join-Path $env:JAVA_HOME "bin/keytool.exe") }
              $keytools += (Join-Path $env:ProgramFiles "Android/Android Studio/jbr/bin/keytool.exe")
              $keytool = $keytools | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $keytool) { throw "Cannot create an Android debug keystore: keytool.exe was not found." }
              & $keytool -genkeypair -v -keystore $debugKey -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
              if ($LASTEXITCODE -ne 0) { throw "Creating the debug keystore failed." }
            }
            $apk = "build/android/VTT-Android-debug.apk"
            & $godot --headless --path $stage --export-debug "Android" (Join-Path (Get-Location).Path $apk)
            if ($LASTEXITCODE -ne 0) { throw "Godot debug Android export failed." }
            $signing = "debug"
          }
          if (-not (Test-Path $apk)) { throw "Android APK is missing: $apk" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apkInfo = Get-Item -LiteralPath $apk
          $archive = [IO.Compression.ZipFile]::OpenRead($apkInfo.FullName)
          try {
            $paths = @($archive.Entries | ForEach-Object { $_.FullName })
            foreach ($essential in @(
              "assets/vtt/data/player_5etools_catalog.json",
              "assets/vtt/data/compendium_items_5etools.json",
              "lib/arm64-v8a/libgodot_android.so"
            )) {
              if ($paths -notcontains $essential) { throw "Essential APK entry absent: $essential" }
            }
            $unexpected = @($paths | Where-Object {
              $_ -match '^assets/\.godot/imported/.*\.(scn|glb)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "apk=$apk"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "signing=$signing"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VTT-Mobile-Android-${{ steps.export.outputs.signing }}-${{ github.run_number }}
          path: ${{ steps.export.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
 -or
              $_ -match '^(assets/)?(encounter/assets/|assets/presets/)' -or
              $_ -like 'lib/x86_64/*' -or
              $_ -match 'post_kaos_editable\.scn'
            })
            if ($unexpected.Count -gt 0) {
              throw "Desktop-only files leaked into Android APK: $($unexpected | Select-Object -First 12)"
            }
          } finally {
            $archive.Dispose()
          }
          $mb = [math]::Round($apkInfo.Length / 1MB, 2)
          Write-Host "APK size: $mb MiB (previous debug build: 386.57 MiB)."
          if ($apkInfo.Length -gt 120MB) { throw "Mobile APK is unexpectedly large ($mb MiB)." }
          Write-Host "APK created: $apk ($signing signing)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "apk=$apk"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "signing=$signing"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VTT-Mobile-Android-${{ steps.export.outputs.signing }}-${{ github.run_number }}
          path: ${{ steps.export.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
