name: VTT PWA Infrastructure Audit
on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "network/pwa_host.gd"
      - "network/tailscale_serve.gd"
      - "network/board_sync.gd"
      - "dnd_base.gd"
      - "vtt/token_list.gd"
      - "vtt/creature_area.gd"
      - "vtt/creature_archive.gd"
      - "vtt/qr/**"
      - "tests/test_pwa_host.gd"
      - "export_presets.cfg"
      - ".github/workflows/pwa-infrastructure.yml"
  pull_request:
    paths:
      - "pwa/**"
      - "network/pwa_host.gd"
      - "network/tailscale_serve.gd"
      - "network/board_sync.gd"
      - "dnd_base.gd"
      - "vtt/token_list.gd"
      - "vtt/creature_area.gd"
      - "vtt/creature_archive.gd"
      - "vtt/qr/**"
      - "tests/test_pwa_host.gd"
      - "vtt/map_data_controller.gd"
      - "docs/pwa-architecture.md"
      - ".github/workflows/pwa-infrastructure.yml"
  workflow_dispatch:

jobs:
  browser-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pwa
      - name: Parse browser ES modules and Service Worker
        shell: bash
        run: |
          set -euo pipefail
          for file in pwa/main.js pwa/ui.js pwa/demo.js pwa/tactical_view.js pwa/catalog_data.js pwa/native_sheet.js pwa/item_controls.js pwa/documents.js pwa/spell_selection.js pwa/sheet_rules.js pwa/structured_effects.js pwa/sheet_rules_view.js pwa/client.js pwa/storage.js pwa/creatures.js pwa/creature_format.js pwa/sw.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test offline creature persistence with IndexedDB emulation
        shell: bash
        run: |
          set -euo pipefail
          cd pwa
          npm install --no-audit --no-fund --no-package-lock
          npm test
      - name: Verify install manifest, precache and PNG files
        shell: python
        run: |
          import json, pathlib, struct, zlib
          root = pathlib.Path("pwa")
          manifest = json.loads((root / "manifest.webmanifest").read_text())
          assert manifest["scope"] == "/" and manifest["start_url"] == "/"
          required = {"/", "/index.html", "/main.js", "/ui.js", "/demo.js", "/tactical_view.js", "/catalog_data.js", "/styles.css", "/client.js", "/storage.js",
                      "/creatures.js", "/creature_format.js", "/native_sheet.js", "/item_controls.js", "/documents.js", "/spell_selection.js", "/sheet_rules.js", "/structured_effects.js", "/sheet_rules_view.js", "/catalog/ability_grants.json", "/catalog/class_mechanics.json", "/catalog/proficiency_grants.json", "/catalog/classes.json", "/catalog/player.json", "/catalog/spells.json", "/sw.js", "/manifest.webmanifest", "/icon.svg",
                      "/icon-192.png", "/icon-512.png"}
          served = (root / "sw.js").read_text()
          for name in required - {"/sw.js"}:
              assert name in served, f"{name} missing from app shell"
          assert '/api/' in served and "indexedDB" not in served
          for icon in manifest["icons"]:
              path = root / icon["src"].lstrip("/")
              data = path.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n")
              off = 8
              compressed = b""
              while off < len(data):
                  size = struct.unpack(">I", data[off:off+4])[0]
                  tag = data[off+4:off+8]
                  content = data[off+8:off+8+size]
                  checksum = struct.unpack(">I", data[off+8+size:off+12+size])[0]
                  assert zlib.crc32(tag + content) & 0xffffffff == checksum
                  if tag == b"IHDR":
                      width, height = struct.unpack(">II", content[:8])
                      assert f"{width}x{height}" == icon["sizes"]
                  if tag == b"IDAT":
                      compressed += content
                  off += size + 12
              assert zlib.decompress(compressed), f"invalid PNG: {path}"
          print("PASS: PWA shell, ES modules, manifest and PNG integrity")

  native-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /pwa/
            /tests/
            /interaction/
            /items/
            /homebrew/
            /encounter/*.gd
            /assets/spell_area_geometry.json
            /assets/tokens/test/test_token_visual.tscn
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Run PWA localhost integration test
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path . --script res://tests/test_pwa_host.gd 2>&1 | tee /tmp/pwa-godot.log
          ! grep -Eq '^SCRIPT ERROR:|^ERROR:' /tmp/pwa-godot.log
          grep -q 'PASS: desktop PWA' /tmp/pwa-godot.log
      - name: Assemble standalone offline prototype
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          root = Path("pwa-prototype")
          (root / "catalog").mkdir(parents=True, exist_ok=True)
          for asset in Path("pwa").iterdir():
              if asset.is_file() and asset.name != "package.json":
                  copy2(asset, root / asset.name)
          sources = {
              "player_5etools_catalog.json": "player.json",
              "compendium_backgrounds_5etools.json": "backgrounds.json",
              "compendium_features_5etools.json": "features.json",
              "compendium_items_5etools.json": "items.json",
          }
          for source, target in sources.items():
              copy2(Path("vtt/data") / source, root / "catalog" / target)
          for file in ("classes", "ability_grants", "class_mechanics", "proficiency_grants"):
              copy2(Path("pwa/catalog") / (file + ".json"), root / "catalog" / (file + ".json"))
          (root / "start-preview.cmd").write_text(
              '@echo off\ncd /d "%~dp0"\necho Apri http://127.0.0.1:8766 nel browser\n'
              'py -3 -m http.server 8766 --bind 127.0.0.1\npause\n')
          (root / "start-preview.sh").write_text(
              '#!/usr/bin/env sh\ncd "$(dirname "$0")" || exit 1\n'
              'python3 -m http.server 8766 --bind 127.0.0.1\n')
          (root / "README.txt").write_text(
              "VTT MOBILE - PROTOTIPO PWA OFFLINE\n\n"
              "1. Estrai la cartella prima di avviarla.\n"
              "2. Su Windows, se Python e installato, fai doppio clic su "
              "start-preview.cmd oppure esegui: py -3 -m http.server 8766\n"
              "3. Apri http://127.0.0.1:8766 sullo stesso PC.\n"
              "4. In Creature usa 'Prova personaggio demo' oppure Importa scheda.\n"
              "5. Esplora statistiche, inventario, risorse, Catalogo e Dadi.\n"
              "6. Il prototipo salva in IndexedDB sul browser: esporta backup!\n\n"
              "Questa distribuzione STATICA non ospita partite multiplayer.\n"
              "Le funzioni Partita e Chat richiedono VTT desktop avviato e\n"
              "la PWA servita dal PC tramite il suo server Godot/Tailscale HTTPS.\n"
              "Non aprire index.html con file://; usa sempre il server locale.\n"
              "Per iPhone usa il vero server desktop e l'indirizzo Tailscale HTTPS.\n")
          PY
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://tests/export_pwa_catalog.gd 2>&1 | tee /tmp/export-pwa.log
          ! grep -Eq '^SCRIPT ERROR:|^ERROR:' /tmp/export-pwa.log
          grep -q 'PASS: exported native built-in PWA spell index' /tmp/export-pwa.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("pwa-prototype")
          for file in ["player", "backgrounds", "features", "items", "spells", "classes", "ability_grants", "class_mechanics", "proficiency_grants"]:
              assert (root / "catalog" / (file + ".json")).exists(), file
          choices = json.loads((root / "catalog/classes.json").read_text())
          assert choices["version"] == 1 and len(choices["classes"]) >= 12
          assert len(choices["subclasses"]) >= 100
          spells = json.loads((root / "catalog" / "spells.json").read_text())
          assert spells["version"] == 1 and len(spells["spells"]) > 50
          assert (root / "demo.js").exists()
          print("PASS: complete standalone offline prototype with built-in catalogs")
          PY
      - name: Publish downloadable mobile prototype
        uses: actions/upload-artifact@v4
        with:
          name: VTT-PWA-prototipo-offline
          path: pwa-prototype/
          retention-days: 14
          if-no-files-found: error

