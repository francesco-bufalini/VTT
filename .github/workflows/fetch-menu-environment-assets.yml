name: Fetch menu environment assets

on:
  push:
    branches:
      - feature/campaign-hub
    paths:
      - .github/workflows/fetch-menu-environment-assets.yml
      - tools/download_menu_environment_assets.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/campaign-hub

      - name: Download CC0 menu assets
        run: python3 tools/download_menu_environment_assets.py

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/menu/environment
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add CC0 main menu environment assets"
          git push origin HEAD:feature/campaign-hub
