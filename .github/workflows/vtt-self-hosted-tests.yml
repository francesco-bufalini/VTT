name: VTT Godot Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/campaign-hub

concurrency:
  group: vtt-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot 4.7.2 validation
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean workspace but keep Godot import cache
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/ -e '*.import' -e '*.uid'

      - name: Show environment
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          & "C:\Program Files\Godot\Godot_v4.7.2-stable_win64.exe" --version

      - name: Validate with Godot
        shell: powershell
        run: .\scripts\validate.ps1 -Godot "C:\Program Files\Godot\Godot_v4.7.2-stable_win64.exe" -Tests
