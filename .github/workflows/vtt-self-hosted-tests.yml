name: VTT Godot Fast Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/campaign-hub
      - feature/structured-creature-sheets
      - feature/tokens-lazy-load
      - feature/origin-spells-dice-bonuses
      - refactor/standalone-creatures-from-pr85
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - "scripts/validate.ps1"
      - ".github/workflows/vtt-self-hosted-tests.yml"
      - "assets/spell_area_geometry.json"
      - "vtt/data/**/*.json"
      - "homebrew/**"

concurrency:
  group: vtt-godot-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot fast validation
    runs-on: [self-hosted, windows, x64, vtt-godot]
    # Hard upper bound: return the self-hosted runner after one minute.
    timeout-minutes: 1

    steps:
      - name: Sparse checkout test surface
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /scripts/
            /tests/
            /vtt/
            /homebrew/
            /network/
            /interaction/
            /items/
            /encounter/*.gd
            /encounter/*.gdshader
            /assets/spell_area_geometry.json
            /assets/tokens/test/test_token_visual.tscn

      - name: Clean generated files while retaining incremental Godot imports
        shell: powershell
        run: |
          git reset --hard HEAD
          # Godot checks import hashes below; preserving .godot avoids reimporting
          # every tracked asset from zero on the persistent Windows runner.
          git clean -ffdx -e .godot/

      # Keep the fast path limited to scripts/scenes, not heavy 3D asset imports.
      # The comprehensive import and token-pack checks live in vtt-full-tests.
      - name: Run bounded Godot smoke tests
        shell: powershell
        run: .\scripts\validate.ps1 -Godot "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe" -SmokeTests
