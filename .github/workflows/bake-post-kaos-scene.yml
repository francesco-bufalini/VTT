name: Bake Post-Kaos Editable Scene

on:
  workflow_dispatch:
  push:
    branches:
      - feature/campaign-hub
    paths:
      - "encounter/tools/bake_post_kaos_scene.gd"
      - ".github/workflows/bake-post-kaos-scene.yml"

permissions:
  contents: write

concurrency:
  group: bake-post-kaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    name: Bake post-Kaos scene
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 12

    steps:
      - name: Sparse checkout bake surface
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /interaction/
            /network/
            /vtt/
            /scripts/
            /encounter/*.gd
            /encounter/*.tscn
            /encounter/*.gdshader
            /encounter/tools/
            /encounter/assets/characters/*.glb
            /encounter/assets/characters/*.glb.import
            /encounter/assets/characters/*.jpg
            /encounter/assets/characters/*.jpg.import
            /encounter/assets/polyhaven/*.jpg
            /encounter/assets/polyhaven/*.jpg.import
            /assets/spell_area_geometry.json
            /assets/tokens/test/

      - name: Clean generated files but keep Godot cache
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/

      - name: Import bake dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bake editable post-Kaos scene
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64.exe"
          & $godot --headless --path . --script res://encounter/tools/bake_post_kaos_scene.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "encounter/post_kaos_editable.scn")) {
            throw "Bake completed without encounter/post_kaos_editable.scn"
          }
          Get-Item "encounter/post_kaos_editable.scn" | Format-List Name,Length,LastWriteTime

      - name: Commit baked scene
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git add encounter/post_kaos_editable.scn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git diff --cached --quiet) {
            Write-Host "Baked scene is already up to date."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bake editable post-Kaos encounter scene"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
