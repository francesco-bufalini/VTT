name: VTT Extended Regression Audit (Godot)
on:
  workflow_dispatch:

jobs:
  extended-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /pwa/catalog/trait_states.json
            /network/
            /interaction/
            /encounter/*.gd
            /items/
            /homebrew/
            /tests/
            /assets/items/
            /assets/tokens/test/
            /assets/spell_area_geometry.json
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run extended functional matrix
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          tests=(
            test_map_data_controller.gd
            test_lan_presence.gd
            test_item_transport.gd
            test_race_subrace_selection.gd
            test_initiative_creature_selection.gd
            test_token_spawn_targeting.gd
            test_tactical_overlay.gd
            test_spell_targeting_lifecycle.gd
            test_aoe_sync.gd
            test_pwa_host.gd
          )
          failures=()
          for test in "${tests[@]}"; do
            echo "::group::$test"
            log=$(mktemp)
            limit=100
            if ! timeout "${limit}s" "$GODOT" --headless --path . --script "res://tests/$test" >"$log" 2>&1; then
              failures+=("$test (crash/timeout)")
            elif grep -Eq '^SCRIPT ERROR:|^ERROR:' "$log" || ! grep -Eq '(^PASS:|^PASS )' "$log"; then
              failures+=("$test (Godot error/failed assertion)")
            fi
            cat "$log"
            rm -f "$log"
            echo "::endgroup::"
          done
          if (( ${#failures[@]} > 0 )); then
            printf 'FAILED REGRESSIONS: %s\\n' "${failures[@]}"
            exit 1
          fi
          echo "PASS: extended tactical/PWA regressions"
