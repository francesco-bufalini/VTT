name: Creature Domain Controller (Godot)

on:
  push:
    branches:
      - refactor/creature-domain-controller
    paths:
      - "vtt/creature_sheet_controller.gd"
      - "vtt/creature_area.gd"
      - "tests/test_creature_sheet_controller.gd"
      - ".github/workflows/creature-controller-regression.yml"
  workflow_dispatch:

jobs:
  controller:
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /homebrew/
            /tests/test_creature_sheet_controller.gd
            /assets/items/
            /assets/spell_area_geometry.json

      - name: Clean generated files
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/

      - name: Import scripts
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $godot --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run controller regression
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          $output = & $godot --headless --path . --script res://tests/test_creature_sheet_controller.gd 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0 -or -not (($output -join "`n") -match "PASS: standalone creature controller")) {
            exit 1
          }
