name: VTT Godot Full Tests

on:
  workflow_dispatch:
  # Run the full suite when changing the shared Godot validation entry point.
  push:
    branches:
      - main
    paths:
      - "scripts/validate.ps1"
      - "tests/**/*.gd"

concurrency:
  group: vtt-godot-full-${{ github.event_name }}
  # Prefer the latest automatic test revision; preserve manually dispatched runs.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate:
    name: Godot full validation
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 30

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Materialize complete checkout after fast sparse runs
        shell: powershell
        run: |
          # actions/checkout with clean:false can retain the fast job's sparse
          # configuration on a persistent self-hosted workspace.
          git sparse-checkout disable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "assets/menu/background")) {
            throw "Full checkout is missing the tracked menu backgrounds."
          }

      - name: Clean generated files but keep Godot cache
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/

      - name: Full import and tests
        shell: powershell
        run: .\scripts\validate.ps1 -Godot "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe" -FullTests

      # Tooling parsing moved out of the 60-second CI smoke job.
      - name: Parse token pack tooling
        shell: powershell
        run: |
          $godot = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $godot --headless --path . --check-only --script res://tools/token_packs/build_one_token_pack.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path . --check-only --script res://tools/token_packs/verify_token_pack.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse token pack PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\tools\build_token_packs.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
