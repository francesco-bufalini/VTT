name: Origin granted spells regression (Godot)

on:
  push:
    branches:
      - feature/origin-spells-dice-bonuses
      - main
    paths:
      - "vtt/**"
      - "tests/test_mobile_chat_sync.gd"
      - "tests/test_share_recipients.gd"
      - "tests/test_origin_granted_spells.gd"
      - "tests/test_document_homebrew.gd"
      - "tests/test_document_delivery_ack.gd"
      - "tests/test_charoptions_as_feats.gd"
      - "tests/test_origin_spell_editor.gd"
      - "tests/test_creature_spellcasting_cast.gd"
      - "tests/test_spellcasting_columns.gd"
      - "tests/test_spellcasting_scaled_layout.gd"
      - "tests/test_global_hover_captions.gd"
      - "tests/test_physics_layout.gd"
      - "tests/test_powers_tracker_layout.gd"
      - ".github/workflows/origin-granted-spells.yml"
  pull_request:
    paths:
      - "vtt/**"
      - "tests/test_mobile_chat_sync.gd"
      - "tests/test_share_recipients.gd"
      - "tests/test_origin_granted_spells.gd"
      - "tests/test_charoptions_as_feats.gd"
      - "tests/test_origin_spell_editor.gd"
      - "tests/test_creature_spellcasting_cast.gd"
      - "tests/test_spellcasting_columns.gd"
      - "tests/test_spellcasting_scaled_layout.gd"
      - "tests/test_global_hover_captions.gd"
      - "tests/test_physics_layout.gd"
      - "tests/test_powers_tracker_layout.gd"
      - ".github/workflows/origin-granted-spells.yml"

jobs:
  origin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/
            /network/
            /tests/test_mobile_chat_sync.gd
            /tests/test_share_recipients.gd
            /tests/test_origin_granted_spells.gd
            /tests/test_document_homebrew.gd
            /tests/test_document_delivery_ack.gd
            /tests/test_charoptions_as_feats.gd
            /tests/test_origin_spell_editor.gd
            /tests/test_creature_spellcasting_cast.gd
            /tests/test_spell_effect_tracking.gd
            /tests/test_spellcasting_columns.gd
            /tests/test_spellcasting_scaled_layout.gd
            /tests/test_global_hover_captions.gd
            /tests/test_physics_layout.gd
            /tests/test_powers_tracker_layout.gd
            /tests/test_bonus_origin_highlight.gd
            /.github/workflows/origin-granted-spells.yml

      - name: Install matching Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Run isolated structured spell grants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vtt-origin-test/tests
          cp -R vtt /tmp/vtt-origin-test/
          cp -R network /tmp/vtt-origin-test/
          cp tests/test_mobile_chat_sync.gd /tmp/vtt-origin-test/tests/
          cp tests/test_share_recipients.gd /tmp/vtt-origin-test/tests/
          cp tests/test_origin_granted_spells.gd /tmp/vtt-origin-test/tests/
          cp tests/test_document_homebrew.gd /tmp/vtt-origin-test/tests/
          cp tests/test_document_delivery_ack.gd /tmp/vtt-origin-test/tests/
          cp tests/test_charoptions_as_feats.gd /tmp/vtt-origin-test/tests/
          cp tests/test_origin_spell_editor.gd /tmp/vtt-origin-test/tests/
          cp tests/test_creature_spellcasting_cast.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spell_effect_tracking.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spellcasting_columns.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spellcasting_scaled_layout.gd /tmp/vtt-origin-test/tests/
          cp tests/test_global_hover_captions.gd /tmp/vtt-origin-test/tests/
          cp tests/test_physics_layout.gd /tmp/vtt-origin-test/tests/
          cp tests/test_powers_tracker_layout.gd /tmp/vtt-origin-test/tests/
          cp tests/test_bonus_origin_highlight.gd /tmp/vtt-origin-test/tests/
          printf 'config_version=5\n' > /tmp/vtt-origin-test/project.godot
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path /tmp/vtt-origin-test --editor --import --quit
          for script in \
            vtt/item_inbox.gd \
            network/creature_presence.gd \
            vtt/creature_inventory_tab.gd \
            vtt/portable_creature_content.gd \
            vtt/creature_documents_tab.gd \
            vtt/creature_area.gd \
            vtt/mobile/creatures_mobile.gd
          do
            /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
              --path /tmp/vtt-origin-test --check-only --script "res://${script}"
          done
          for test in \
            test_mobile_chat_sync \
            test_share_recipients \
            test_document_homebrew \
            test_document_delivery_ack \
            test_powers_tracker_layout \
            test_origin_granted_spells \
            test_charoptions_as_feats \
            test_origin_spell_editor \
            test_creature_spellcasting_cast \
            test_spell_effect_tracking \
            test_spellcasting_columns \
            test_spellcasting_scaled_layout \
            test_global_hover_captions \
            test_physics_layout \
            test_bonus_origin_highlight
          do
            echo "RUN Godot regression: ${test}"
            output=$(timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
              --path /tmp/vtt-origin-test \
              --script "res://tests/${test}.gd" 2>&1) || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            # Godot can print parser errors yet return exit code 0.
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script' <<< "$output"; then
              echo "Godot script compilation/runtime failure: ${test}"
              exit 1
            fi
          done
