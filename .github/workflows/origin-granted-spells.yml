name: Origin granted spells and structured bonuses (Godot)
on:
  pull_request:
    paths:
      - "vtt/origin_spell_grants.gd"
      - "vtt/creature_active_spells.gd"
      - "vtt/creature_dice_bonuses.gd"
      - "vtt/structured_origin_spells_5etools.gd"
      - "vtt/creature_proficiency_rules.gd"
      - "vtt/data/**"
      - "tests/test_origin_granted_spells.gd"
      - "tests/test_charoptions_as_feats.gd"
      - ".github/workflows/origin-granted-spells.yml"
  push:
    branches: [main]
    paths:
      - "vtt/origin_spell_grants.gd"
      - "vtt/creature_active_spells.gd"
      - "vtt/structured_origin_spells_5etools.gd"
jobs:
  origin-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/
            /pwa/icons/
            /pwa/catalog/trait_states.json
            /homebrew/
            /tests/test_origin_granted_spells.gd
            /tests/test_charoptions_as_feats.gd
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate source-qualified spell and feat grants
        shell: bash
        run: |
          set -euo pipefail
          printf 'config_version=5\n[autoload]\nTokenPackManager="*res://vtt/token_pack_manager.gd"\n' > project.godot
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import --quit
          for test in test_origin_granted_spells test_charoptions_as_feats; do
            output=$(timeout 90s "$GODOT" --headless --path . --script "res://tests/${test}.gd" 2>&1) || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Assertion failed' <<< "$output" \
              || ! grep -Eq '^PASS' <<< "$output"; then
              echo "Regression failed: $test"
              exit 1
            fi
          done
