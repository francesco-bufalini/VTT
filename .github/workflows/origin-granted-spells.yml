name: Origin granted spells regression (Godot)

on:
  push:
    branches:
      - feature/origin-spells-dice-bonuses
      - main
    paths:
      - "vtt/**"
      - "tests/test_origin_granted_spells.gd"
      - "tests/test_origin_spell_editor.gd"
      - "tests/test_creature_spellcasting_cast.gd"
      - "tests/test_spellcasting_columns.gd"
      - "tests/test_spellcasting_scaled_layout.gd"
      - ".github/workflows/origin-granted-spells.yml"
  pull_request:
    paths:
      - "vtt/**"
      - "tests/test_origin_granted_spells.gd"
      - "tests/test_origin_spell_editor.gd"
      - "tests/test_creature_spellcasting_cast.gd"
      - "tests/test_spellcasting_columns.gd"
      - "tests/test_spellcasting_scaled_layout.gd"
      - ".github/workflows/origin-granted-spells.yml"

jobs:
  origin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/
            /tests/test_origin_granted_spells.gd
            /tests/test_origin_spell_editor.gd
            /tests/test_creature_spellcasting_cast.gd
            /tests/test_spell_effect_tracking.gd
            /tests/test_spellcasting_columns.gd
            /tests/test_spellcasting_scaled_layout.gd
            /tests/test_bonus_origin_highlight.gd
            /.github/workflows/origin-granted-spells.yml

      - name: Install matching Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Run isolated structured spell grants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vtt-origin-test/tests
          cp -R vtt /tmp/vtt-origin-test/
          cp tests/test_origin_granted_spells.gd /tmp/vtt-origin-test/tests/
          cp tests/test_origin_spell_editor.gd /tmp/vtt-origin-test/tests/
          cp tests/test_creature_spellcasting_cast.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spell_effect_tracking.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spellcasting_columns.gd /tmp/vtt-origin-test/tests/
          cp tests/test_spellcasting_scaled_layout.gd /tmp/vtt-origin-test/tests/
          cp tests/test_bonus_origin_highlight.gd /tmp/vtt-origin-test/tests/
          printf 'config_version=5\n' > /tmp/vtt-origin-test/project.godot
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path /tmp/vtt-origin-test --editor --import --quit
          for test in \
            test_origin_granted_spells \
            test_origin_spell_editor \
            test_creature_spellcasting_cast \
            test_spell_effect_tracking \
            test_spellcasting_columns \
            test_spellcasting_scaled_layout \
            test_bonus_origin_highlight
          do
            echo "RUN Godot regression: ${test}"
            timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
              --path /tmp/vtt-origin-test \
              --script "res://tests/${test}.gd"
          done
