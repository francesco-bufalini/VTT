name: Origin granted spells regression (Godot)

on:
  push:
    branches:
      - feature/origin-spells-dice-bonuses
    paths:
      - "vtt/**"
      - "tests/test_origin_granted_spells.gd"
      - ".github/workflows/origin-granted-spells.yml"
  pull_request:
    paths:
      - "vtt/**"
      - "tests/test_origin_granted_spells.gd"
      - ".github/workflows/origin-granted-spells.yml"

jobs:
  origin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/
            /tests/test_origin_granted_spells.gd
            /.github/workflows/origin-granted-spells.yml

      - name: Install matching Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Run isolated structured spell grants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vtt-origin-test/tests
          cp -R vtt /tmp/vtt-origin-test/
          cp tests/test_origin_granted_spells.gd /tmp/vtt-origin-test/tests/
          printf 'config_version=5\n' > /tmp/vtt-origin-test/project.godot
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path /tmp/vtt-origin-test --editor --import --quit
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path /tmp/vtt-origin-test \
            --script res://tests/test_origin_granted_spells.gd
