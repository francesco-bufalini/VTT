name: Creature Modularization Audit

on:
  push:
    branches:
      - audit/creature-modularization-regressions
  workflow_dispatch:

jobs:
  regression:
    runs-on: [self-hosted, windows, x64, vtt-godot]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/test_token_visual.tscn
      - shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .godot/
      - name: Import
        shell: powershell
        run: |
          $exe = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          & $exe --headless --path . --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Differential domain audit and standalone smoke
        shell: powershell
        run: |
          $exe = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          foreach ($test in @("test_creature_modularization_audit.gd", "test_creature_sheet_controller.gd", "test_standalone_creatures.gd")) {
            Write-Host "== $test =="
            $log = [IO.Path]::GetTempFileName()
            $process = Start-Process -FilePath $exe -ArgumentList @("--headless", "--path", ".", "--script", "res://tests/$test") -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError ($log + ".err")
            $out = (Get-Content $log -Raw -ErrorAction SilentlyContinue) + (Get-Content ($log + ".err") -Raw -ErrorAction SilentlyContinue)
            Write-Host $out
            if ($process.ExitCode -ne 0 -or $out -notmatch "PASS:" -or $out -match "SCRIPT ERROR:") { throw "Regression failed: $test" }
            Remove-Item $log, ($log + ".err") -ErrorAction SilentlyContinue
          }

      - name: Extended desktop regression matrix
        shell: powershell
        run: |
          $exe = "C:\Program Files\Godot\Godot_v4.7.2-stable_win64_console.exe"
          foreach ($test in @(
            "test_creature_sheets.gd",
            "test_creature_archive_revisions.gd",
            "test_damage_defenses.gd",
            "test_benefit_first_origins_trackers.gd",
            "test_bonus_origin_highlight.gd",
            "test_origin_spell_editor.gd",
            "test_dice_chat_sync.gd",
            "test_creature_sync.gd"
          )) {
            Write-Host "== $test =="
            $stdout = [IO.Path]::GetTempFileName()
            $stderr = $stdout + ".err"
            $process = Start-Process -FilePath $exe -ArgumentList @("--headless", "--path", ".", "--script", "res://tests/$test") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(90000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Timed out: $test"
            }
            $out = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            Write-Host $out
            if ($process.ExitCode -ne 0 -or $out -notmatch "PASS:" -or $out -match "SCRIPT ERROR:") {
              throw "Regression failed: $test"
            }
            Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
          }
