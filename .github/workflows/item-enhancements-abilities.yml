name: Item enhancements and structured abilities (Godot)
on:
  pull_request:
    paths:
      - "vtt/creature_infusions.gd"
      - "vtt/item_enhancement_rules.gd"
      - "vtt/activated_ability_catalog.gd"
      - "vtt/origin_spell_grants.gd"
      - "vtt/spells/spell_catalog.gd"
      - "vtt/structured_resource_trackers.gd"
      - "vtt/data/artificer_infusions_5etools.json"
      - "vtt/data/activated_abilities_5etools.json"
      - ".github/workflows/item-enhancements-abilities.yml"
  push:
    branches: [main]
    paths:
      - "vtt/**"
      - ".github/workflows/item-enhancements-abilities.yml"
jobs:
  structured-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vtt/
            /pwa/icons/
            /pwa/catalog/trait_states.json
            /homebrew/
            /tests/test_structured_resource_trackers.gd
            /tests/test_split_item_bonuses.gd
            /tests/test_origin_granted_spells.gd
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Test retained rule models
        shell: bash
        run: |
          set -euo pipefail
          printf 'config_version=5\n[autoload]\nTokenPackManager="*res://vtt/token_pack_manager.gd"\n' > project.godot
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import --quit
          for test in test_structured_resource_trackers test_split_item_bonuses test_origin_granted_spells; do
            output=$(timeout 90s "$GODOT" --headless --path . --script "res://tests/${test}.gd" 2>&1) || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Assertion failed' <<< "$output" \
              || ! grep -Eq '^PASS' <<< "$output"; then
              echo "Regression failed: $test"
              exit 1
            fi
          done
