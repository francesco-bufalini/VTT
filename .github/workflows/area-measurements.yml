name: Area measurements and controls (Godot)

on:
  pull_request:
    paths:
      - "measurement_tool.gd"
      - "dnd_base.gd"
      - "vtt/spells/spell_target_overlay_2d.gd"
      - "tests/test_area_dimensions.gd"
      - "tests/test_measurement_token_elevation.gd"
      - ".github/workflows/area-measurements.yml"
  push:
    branches: [main]
    paths:
      - "measurement_tool.gd"
      - "dnd_base.gd"
      - "vtt/spells/spell_target_overlay_2d.gd"
      - "tests/test_area_dimensions.gd"
      - "tests/test_measurement_token_elevation.gd"
      - ".github/workflows/area-measurements.yml"
  workflow_dispatch:

jobs:
  measurement-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /interaction/
            /encounter/*.gd
            /items/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run measurement regressions
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          for test in test_area_dimensions test_measurement_token_elevation test_aoe_sync; do
            echo "== ${test}.gd =="
            log=$(mktemp)
            if ! timeout 110s "$GODOT" --headless --path . --script "res://tests/${test}.gd" >"$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
            grep -q "PASS:" "$log"
            if grep -Eq 'SCRIPT ERROR:|^ERROR:' "$log"; then
              exit 1
            fi
            rm -f "$log"
          done
