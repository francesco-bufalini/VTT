name: Install supplied main menu background

on:
  push:
    branches:
      - feature/campaign-hub
    paths:
      - tools/menu_background_source.b64
      - .github/workflows/install-menu-background.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/campaign-hub

      - name: Decode supplied background
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          source = Path("tools/menu_background_source.b64")
          target = Path("assets/menu/background/menu_background.jpg")
          data = base64.b64decode(source.read_text().strip(), validate=True)

          digest = hashlib.sha256(data).hexdigest()
          expected = "d23f6c266057cf5ef9a22b495c14c7d044fa1b75af7161247d7dbe75d788ae03"
          if digest != expected:
              raise SystemExit(f"Checksum mismatch: {digest} != {expected}")

          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Decoded payload is not a JPEG")

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f"Installed {target}: {len(data)} bytes")
          PY

      - name: Commit installed background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/menu/background/menu_background.jpg
          if git diff --cached --quiet; then
            echo "No background changes to commit."
            exit 0
          fi
          git commit -m "Install supplied fantasy landscape menu background"
          git push origin HEAD:feature/campaign-hub
