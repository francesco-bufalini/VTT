name: VTT Benefit Type Enrichment Schemas

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_proficiency_grants.py'
      - 'scripts/generate_structured_ability_grants.py'
      - 'scripts/test_background_5etools_generators.py'
      - 'vtt/data/proficiency_grants_5etools.json'
      - 'vtt/data/structured_ability_grants_5etools.json'
      - 'vtt/enrichment/authoring/**'
      - 'vtt/enrichment/benefits/**'
      - 'assets/spell_area_geometry.json'
      - 'scripts/validate_enrichment_authoring_schemas.py'
      - 'scripts/audit_background_benefits.py'
      - 'scripts/test_background_benefit_migration.py'
      - '.github/workflows/benefit-type-enrichment-schemas.yml'
  pull_request:
    paths:
      - 'scripts/generate_proficiency_grants.py'
      - 'scripts/generate_structured_ability_grants.py'
      - 'scripts/test_background_5etools_generators.py'
      - 'vtt/data/proficiency_grants_5etools.json'
      - 'vtt/data/structured_ability_grants_5etools.json'
      - 'vtt/enrichment/authoring/**'
      - 'vtt/enrichment/benefits/**'
      - 'assets/spell_area_geometry.json'
      - 'scripts/validate_enrichment_authoring_schemas.py'
      - 'scripts/audit_background_benefits.py'
      - 'scripts/test_background_benefit_migration.py'
      - '.github/workflows/benefit-type-enrichment-schemas.yml'
  workflow_dispatch:

jobs:
  schema:
    name: Validate per-type benefits and spell areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate benefit schemas, fixtures and legacy areas
        run: python scripts/validate_enrichment_authoring_schemas.py
      - name: Test background audit and catalog contract
        run: python -m unittest discover -s scripts -p test_background_benefit_migration.py
      - name: Check background generators
        run: python -m unittest discover -s scripts -p test_background_5etools_generators.py
      - name: Audit bundled background indexes
        run: python scripts/audit_background_benefits.py --output /tmp/vtt-background-index-audit.json
