name: Creature Feature Domain Regression

on:
  push:
    branches: [main]
    paths:
      - "vtt/creature_features.gd"
      - "vtt/creature_traits_tab.gd"
      - "vtt/creature_proficiency_rules.gd"
      - "vtt/creature_bonus_rules.gd"
      - "vtt/creature_structured_bonuses.gd"
      - "vtt/creature_origin_choices.gd"
      - "vtt/origin_spell_grants.gd"
      - "vtt/structured_origin_spells_5etools.gd"
      - "vtt/creature_feats_tab.gd"
      - "vtt/creature_proficiencies_tab.gd"
      - "vtt/creature_bonus_tab.gd"
      - "vtt/creature_damage_defenses_tab.gd"
      - "vtt/creature_trackers_tab.gd"
      - "vtt/creature_item_rules.gd"
      - "tests/test_creature_features_standalone.gd"
      - ".github/workflows/creature-feature-domain.yml"
  workflow_dispatch:

jobs:
  feature-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /project.godot
            /*.gd
            /*.tscn
            /vtt/
            /network/
            /homebrew/
            /tests/
            /assets/items/
            /assets/spell_area_geometry.json
            /assets/tokens/test/test_token_visual.tscn
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Feature projection, origin and equipment regressions
        run: |
          set -euo pipefail
          for test in \
            test_creature_features_standalone.gd \
            test_trait_origins.gd \
            test_structured_numeric_bonuses.gd \
            test_creature_equipment_regressions.gd \
            test_benefit_first_origins_trackers.gd \
            test_structured_resource_trackers.gd \
            test_origin_granted_spells.gd \
            test_unified_origin_editor_cards.gd
          do
            echo "== ${test} =="
            timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 \
              --headless --path . --script "res://tests/${test}" > /tmp/feature-test.log 2>&1 || {
              cat /tmp/feature-test.log
              exit 1
            }
            cat /tmp/feature-test.log
            grep -q "PASS:" /tmp/feature-test.log
            if grep -Eq "SCRIPT ERROR:|ERROR: Failed to load script" /tmp/feature-test.log; then exit 1; fi
          done
