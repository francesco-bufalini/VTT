name: One-time stale branch cleanup (2026-10-31)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-prune-stale-branches-20261031.yml'
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'francesco-bufalini/VTT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove branches whose latest commit predates October 28, 2026, 19:09 UTC
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: francesco-bufalini/VTT
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPOSITORY']
          root = 'https://api.github.com/repos/' + repo
          cutoff = datetime.datetime(2026, 10, 28, 19, 9, tzinfo=datetime.timezone.utc)
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'VTT-one-time-branch-cleanup',
          }
          def api(path, method='GET'):
              request = urllib.request.Request(root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {path}: {error.code} {detail[:350]}') from error

          default = api('')['default_branch']
          opened = []
          page = 1
          while True:
              data = api(f'/pulls?state=open&per_page=100&page={page}')
              opened.extend(data)
              if len(data) < 100:
                  break
              page += 1
          active = {entry['head']['ref'] for entry in opened
                    if entry['head']['repo'] and entry['head']['repo']['full_name'] == repo}
          branches = []
          page = 1
          while True:
              data = api(f'/branches?per_page=100&page={page}')
              branches.extend(data)
              if len(data) < 100:
                  break
              page += 1
          commits = {}
          obsolete = []
          protected = []
          recent = []
          for branch in branches:
              name = branch['name']
              if name == default or branch.get('protected') or name in active:
                  protected.append(name)
                  continue
              sha = branch['commit']['sha']
              if sha not in commits:
                  detail = api('/commits/' + sha)
                  iso = (detail.get('commit', {}).get('committer') or {}).get('date')
                  if not iso:
                      raise RuntimeError(f'Missing commit date for {name} ({sha})')
                  commits[sha] = datetime.datetime.fromisoformat(iso.replace('Z', '+00:00'))
              if commits[sha] < cutoff:
                  obsolete.append((name, sha, commits[sha]))
              else:
                  recent.append(name)
          print(f'Audit: {len(branches)} branches, {len(obsolete)} stale, '
                f'{len(recent)} recent, {len(protected)} default/protected/active-PR', flush=True)
          print('Cutoff (UTC): ' + cutoff.isoformat(), flush=True)
          failures = []
          for index, (name, sha, last_commit) in enumerate(obsolete, 1):
              escaped = urllib.parse.quote(name, safe='/')
              try:
                  api('/git/refs/heads/' + escaped, 'DELETE')
                  print(f'DELETED {index}/{len(obsolete)} {name} ({last_commit.isoformat()})', flush=True)
              except Exception as error:
                  failures.append(name)
                  print(f'FAILED {name}: {error}', flush=True)
          print(f'Summary: {len(obsolete)-len(failures)} deleted, {len(failures)} failed; '
                f'{len(recent)+len(protected)} kept', flush=True)
          if failures:
              sys.exit(1)
          PY
