<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VTT Mobile">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png?v=20261023b" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=20261023b">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile_metal_theme.css">
  <title>VTT Mobile</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><button type="button" id="creature-back" class="header-back" data-act="back" aria-label="Torna alle creature" title="Torna alle creature" hidden>‹</button><div class="brand-identity"><span id="creature-name">VTT</span><small id="creature-classes" hidden></small></div><button type="button" id="creature-forms" class="header-icon-button header-forms" data-act="creature-variants" aria-label="Forme e varianti" aria-haspopup="dialog" aria-controls="creature-variants-dialog" title="Forme e varianti" hidden></button></div>
      <div class="header-actions" id="header-actions">
        <button type="button" id="header-chat" class="header-icon-button header-chat-button" data-act="header-chat-open" aria-label="Apri chat" title="Chat" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5A7.5 7.5 0 0 1 12.5 19H6l-3 2v-9.5A7.5 7.5 0 0 1 10.5 4h2a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M8 11.5h8M8 14.5h5"/></svg>
        </button>
        <button type="button" id="header-chat-notifications" class="header-icon-button header-chat-notify" data-act="toggle-chat-notifications" aria-label="Attiva notifiche chat" title="Notifiche chat" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        </button>
        <button type="button" id="header-dice" class="header-icon-button header-dice-button" data-act="open-chat-dice" aria-label="Apri dadi" title="Lancia i dadi" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="header-preferences" class="header-icon-button header-preferences-button" data-act="distance-preferences-open" aria-label="Preferenze e unità di distanza" title="Preferenze">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" class="connection-link" data-nav="session" aria-label="Apri partita: mappa e collegamento"><span class="connection-label">Partita ↗</span><span id="connection" class="connection" role="status" aria-live="polite">Archivio offline</span></button>
      </div>
    </header>
    <nav id="mobile-tabs" class="play-dock" aria-label="Navigazione principale">
      <div id="nav" class="global-destinations">
        <button type="button" class="btn" data-nav="library" aria-label="Creature">Creature</button>
        <button type="button" class="btn" data-nav="catalog" aria-label="Catalogo">Catalogo</button>
        <button type="button" class="btn" data-nav="session" aria-label="Partita">Partita</button>
      </div>
      <div id="sheet-navigation" class="play-destinations" hidden></div>
      <button type="button" id="dock-session" class="btn dock-session dock-destination" data-nav="session" aria-label="Partita" hidden></button>
    </nav>
    <main id="app" class="content" tabindex="-1" aria-label="Contenuto principale">
      <p class="muted">Apertura archivio locale…</p>
    </main>
    <section id="chat-screen" class="chat-screen" aria-label="Chat della partita" hidden></section>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  </div>
  <input type="file" id="import-creature" accept=".json,application/json" hidden>
  <input type="file" id="import-backup" accept=".json,application/json" hidden>
  <script type="module" src="/main.js"></script>
</body>
</html>
