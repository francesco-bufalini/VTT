<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VTT Mobile">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile_metal_theme.css">
  <title>VTT Mobile</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span id="creature-symbol" class="creature-symbol" aria-hidden="true">♜</span><span id="creature-name">VTT</span></div>
      <div id="connection" class="connection" role="status" aria-live="polite">Archivio offline</div>
    </header>
    <nav id="mobile-tabs" class="mobile-tabs" aria-label="Navigazione principale e schede">
      <div id="nav" class="mobile-primary-tabs" aria-label="Sezioni principali">
        <button type="button" class="btn" data-nav="library" title="Seleziona creatura" aria-label="Seleziona creatura">♜</button>
        <button type="button" class="btn" data-nav="catalog" title="Catalogo" aria-label="Catalogo">▤</button>
        <button type="button" class="btn" data-nav="session" title="Partita" aria-label="Partita">⚔</button>
      </div>
      <div id="sheet-navigation" class="mobile-sheet-tabs" aria-label="Schede creatura"></div>
    </nav>
    <main id="app" class="content" tabindex="-1" aria-label="Contenuto principale">
      <p class="muted">Apertura archivio locale…</p>
    </main>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  </div>
  <input type="file" id="import-creature" accept=".json,application/json" hidden>
  <input type="file" id="import-backup" accept=".json,application/json" hidden>
  <script type="module" src="/main.js"></script>
</body>
</html>
