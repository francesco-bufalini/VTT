<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221f1e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VTT Mobile">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg?v=20261023" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=20261023">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile_metal_theme.css">
  <title>VTT Mobile</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><button type="button" id="creature-back" class="header-back" data-act="back" aria-label="Torna alle creature" title="Torna alle creature" hidden>‹</button><div class="brand-identity"><span id="creature-name">VTT</span><small id="creature-classes" hidden></small></div></div>
      <button type="button" class="connection-link" data-nav="session" aria-label="Apri partita: mappa, chat e dadi"><span class="connection-label">Partita ↗</span><span id="connection" class="connection" role="status" aria-live="polite">Archivio offline</span></button>
    </header>
    <nav id="mobile-tabs" class="play-dock" aria-label="Navigazione principale">
      <div id="nav" class="global-destinations">
        <button type="button" class="btn" data-nav="library" aria-label="Creature">Creature</button>
        <button type="button" class="btn" data-nav="catalog" aria-label="Catalogo">Catalogo</button>
        <button type="button" class="btn" data-nav="session" aria-label="Partita">Partita</button>
      </div>
      <div id="sheet-navigation" class="play-destinations" hidden></div>
      <button type="button" id="dock-catalog" class="btn dock-catalog dock-destination" data-nav="catalog" aria-label="Catalogo" hidden></button>
      <button type="button" id="dock-session" class="btn dock-session dock-destination" data-nav="session" aria-label="Partita" hidden></button>
    </nav>
    <main id="app" class="content" tabindex="-1" aria-label="Contenuto principale">
      <p class="muted">Apertura archivio locale…</p>
    </main>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
  </div>
  <input type="file" id="import-creature" accept=".json,application/json" hidden>
  <input type="file" id="import-backup" accept=".json,application/json" hidden>
  <script type="module" src="/main.js"></script>
</body>
</html>
