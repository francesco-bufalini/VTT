<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apertura VTT</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#221f1e;color:#f2e3c7;font:16px system-ui,sans-serif}
    main{max-width:32rem;padding:2rem;text-align:center}
    button{padding:.8rem 1.2rem;border:1px solid #e3b36b;border-radius:.5rem;background:#352a2b;color:inherit;cursor:pointer}
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <p id="status">Apertura della sezione VTT…</p>
    <button type="button" id="retry" hidden>Riprova</button>
  </main>
  <script>
    // The native WebView uses the same origin and IndexedDB as the PWA.
    // This uncached route is deliberately OUTSIDE the Service Worker shell.
    // Remove an obsolete controller before loading modules; do not clear
    // CacheStorage or IndexedDB (which contains the creature archive).
    (async function openNativeView(){
      const section = new URLSearchParams(location.search).get('native_view');
      const status = document.querySelector('#status');
      const retry = document.querySelector('#retry');
      if (section !== 'creatures' && section !== 'compendium') {
        status.textContent = 'Sezione VTT non riconosciuta.';
        return;
      }
      const bounded = (promise, ms) => Promise.race([
        promise, new Promise((_,reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
      try {
        if ('serviceWorker' in navigator) {
          const registration = await bounded(navigator.serviceWorker.getRegistration('/'), 6000);
          if (registration) await bounded(registration.unregister(), 6000);
        }
        location.replace('/?native_view=' + encodeURIComponent(section));
      } catch (error) {
        // If there is no controller, no stale shell can intercept the app.
        if (!navigator.serviceWorker?.controller) {
          location.replace('/?native_view=' + encodeURIComponent(section));
          return;
        }
        status.textContent = 'Impossibile disattivare la vecchia cache della PWA. Riprova.';
        retry.hidden = false;
        retry.onclick = () => location.reload();
        console.warn('VTT native cache recovery failed', error);
      }
    })();
  </script>
</body>
</html>
